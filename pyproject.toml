[project]
name = "octave-mcp"
version = "1.16.0"
description = "OCTAVE MCP Server - Lenient-to-Canonical OCTAVE pipeline with schema validation and generative holographic contracts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Elevana", email = "shaun.buswell@elevana.com"}
]
maintainers = [
    {name = "Elevana", email = "shaun.buswell@elevana.com"}
]
keywords = [
    "octave",
    "mcp",
    "model-context-protocol",
    "ai",
    "llm",
    "protocol",
    "schema-validation",
    "compression"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed"
]
dependencies = [
    "mcp>=1.30.0,<2",  # GH#519: <2 ceiling (mcp 2.x renamed camelCase kwargs to snake_case, breaking); CVE-2026-116684, CVE-2026-116685, CVE-2026-116686, CVE-2026-59951: floor 1.30.0 clears open advisories
    "click>=8.1.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",
    "PyJWT>=2.15.0",  # CVE-2026-101917, CVE-2026-102270, CVE-2026-102271, CVE-2026-48523..48526: JWT validation advisories (GHSA-pxh4-856f-4h89 range <= 2.13.0 per alert #53)
    "python-multipart>=0.0.31",  # CVE-2026-53537, CVE-2026-53538, CVE-2026-53539, CVE-2026-53540: multipart parsing advisories
    "cryptography>=50.0.0",  # CVE-2026-69247, CVE-2026-69248, CVE-2026-69249, GHSA-537c-gmf6-5ccf: floor 50.0.0 clears open advisories
    "filelock>=4.2.1",  # CVE-2026-112907, CVE-2026-112909, CVE-2026-112910, CVE-2026-112913, CVE-2026-112915, CVE-2026-112935, CVE-2026-112936, CVE-2026-112939, CVE-2026-112940: lock-file advisories
    "anyio>=4.14.2",  # CVE-2026-64847, CVE-2026-63374: transitive via mcp; floored because pip ignores uv.lock
    "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2: transitive via httpx (mcp); floored because pip ignores uv.lock
    "idna>=3.15",  # CVE-2026-45409: transitive via httpx/anyio (mcp); floored because pip ignores uv.lock
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j: transitive via mcp; floored because pip ignores uv.lock
    "starlette>=1.3.1",  # CVE-2026-54283, CVE-2026-48710, CVE-2026-48817, CVE-2026-48818: transitive via mcp; core floor because pip ignores uv.lock (also kept in the http extra)
]

[project.urls]
Homepage = "https://github.com/elevanaltd/octave-mcp"
Documentation = "https://github.com/elevanaltd/octave-mcp/tree/main/docs"
Repository = "https://github.com/elevanaltd/octave-mcp.git"
Issues = "https://github.com/elevanaltd/octave-mcp/issues"
Changelog = "https://github.com/elevanaltd/octave-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
http = [
    "starlette>=1.3.1",  # CVE-2026-54283, CVE-2026-48710, CVE-2026-48817, CVE-2026-48818: HTTP transport advisories
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",  # For testing HTTP transport
    "sse-starlette>=2.2.0",  # SSE support for streaming
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12",
    "ruff>=0.9.0",
    "black>=26.10.1",  # CVE-2026-114134
    "hypothesis>=6.122.0",
    "pre-commit>=4.1.0",
    "httpx>=0.28.0",  # For testing HTTP transport
    "Pygments>=2.20.0",  # CVE-2025-61833: ReDoS vulnerability
    "virtualenv>=21.14.9",  # CVE-2026-113714..113726 (incl. CVE-2026-113718, CVE-2026-113724): TOCTOU and related advisories
    "tiktoken>=0.14.0",  # GH-primer-token-budget-500: real cl100k_base token counts in tests
]

# PEP-735 dependency group mirroring the `dev` extra above.
# Rationale (#462): uv installs the `dev` dependency-group by DEFAULT on a bare
# `uv sync` (no flags required), whereas `[project.optional-dependencies].dev`
# is an EXTRA that only installs under `uv sync --all-extras` / `--extra dev` /
# `pip install -e ".[dev]"`. Declaring the group as well makes the worktree
# `.venv` robust to a sync invocation that omits `--all-extras`, so dev tooling
# (ruff/black/pytest-cov/mypy + coverage HTML toolchain) reliably lands in
# `.venv/bin`. The extra is retained for the pip-fallback install path.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12",
    "ruff>=0.9.0",
    "black>=26.10.1",  # CVE-2026-114134
    "hypothesis>=6.122.0",
    "pre-commit>=4.1.0",
    "httpx>=0.28.0",  # For testing HTTP transport
    "Pygments>=2.20.0",  # CVE-2025-61833: ReDoS vulnerability
    "virtualenv>=21.14.9",  # CVE-2026-113714..113726 (incl. CVE-2026-113718, CVE-2026-113724): TOCTOU and related advisories
    "tiktoken>=0.14.0",  # GH-primer-token-budget-500: real cl100k_base token counts in tests
]

[project.scripts]
octave = "octave_mcp.cli.main:cli"
octave-mcp-server = "octave_mcp.mcp.server:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["octave_mcp*"]

[tool.setuptools.package-data]
octave_mcp = [
    "schemas/builtin/*.oct.md",
    "resources/**/*.oct.md",
    "resources/**/*.md",
    "resources/specs/schemas/*.oct.md",
    "resources/specs/vocabularies/*.oct.md",
    "resources/specs/vocabularies/**/*.oct.md",
    "py.typed"
]

[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=octave_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.hypothesis]
max_examples = 100
derandomize = true

[tool.hypothesis.profiles.ci]
max_examples = 500
deadline = 1000

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
